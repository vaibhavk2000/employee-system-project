name: NovaPay Secure CI/CD

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Application
        run: mvn clean package

  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SonarQube Scan
        run: sonar-scanner

  dependency-scan:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - name: Trivy Dependency Scan
        run: trivy fs .

  container-scan:
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Image
        run: docker build -t novapay:${{ github.sha }} .

      - name: Scan Docker Image
        run: trivy image novapay:${{ github.sha }}

  integration-test:
    needs: container-scan
    runs-on: ubuntu-latest
    steps:
      - name: Run Integration Tests
        run: mvn verify

  dast:
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - name: OWASP ZAP Scan
        run: zap-baseline.py -t https://staging.novapay.com

  compliance:
    needs: dast
    runs-on: ubuntu-latest
    steps:
      - name: Generate SBOM
        run: syft . -o spdx-json

      - name: OPA Policy Validation
        run: conftest test kubernetes/

  deploy:
    needs: compliance
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through ArgoCD
        run: argocd app sync novapay-prod

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health Check
        run: curl https://api.novapay.com/health
